# Inventario inicial. Se carga con: python manage.py seed_inventory
# Precios PENDIENTES: todos los productos quedan en "borrador" hasta que la administradora
# complete precio de compra y de venta desde el admin.
# Fotos: ./seed/images/<slug>.jpg (o .png/.webp). Si falta, el producto queda marcado "sin imagen".

categorias:
  - {nombre: Bolsos, slug: bolsos, orden: 1}
  - {nombre: Mochilas, slug: mochilas, orden: 2}
  - {nombre: Fragancias, slug: fragancias, orden: 3}
  - {nombre: Cuidado corporal, slug: cuidado-corporal, orden: 4}

marcas:
  - {nombre: "Victoria's Secret", slug: victorias-secret}
  - {nombre: PINK, slug: pink}
  - {nombre: Por confirmar, slug: por-confirmar}

# PLACEHOLDER: costos y cobertura por confirmar con la administradora. Se editan en el admin.
zonas_envio:
  - {nombre: Delivery en Lima, metodo: delivery_lima, costo: 10, cobertura: "Lima Metropolitana (por confirmar)", orden: 1}
  - {nombre: Recojo en punto de encuentro, metodo: recojo, costo: 0, instrucciones: "Punto de recojo por confirmar.", orden: 2}
  - {nombre: Envío a provincias, metodo: courier_provincia, costo: 20, courier: "Por confirmar", cobertura: "Todo el Perú", orden: 3}

