name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tiendanataly
          POSTGRES_USER: tiendanataly
          POSTGRES_PASSWORD: tiendanataly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tiendanataly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: clave-solo-para-ci
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: tiendanataly
      SEED_DIR: ${{ github.workspace }}/seed
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (incluye concurrencia en PostgreSQL)
        run: pytest -p no:cacheprovider
      - name: Auditoría de dependencias
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Buscar secretos en el repositorio
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
